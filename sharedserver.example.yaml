server:
  host: 0.0.0.0
  port: 8080
  https: false               # optional self-signed TLS

share:
  directory: ./
  max_upload_size: 1073741824  # bytes, default 1 GiB
  mode: full                 # full | readonly | droponly
  rename_on_conflict: false   # append a number instead of HTTP 409
  read_only: false            # downloads and text sync; no file writes when true

clipboard:
  max_text_size: 2097152       # bytes, default 2 MiB
  text_extensions:
    - .txt
    - .md
    - .json
    - .xml
    - .yaml
    - .yml
    - .csv
    - .log
    - .py
    - .js
    - .html
    - .css
    - .java
    - .c
    - .cpp
  image_extensions:
    - .png
    - .jpg
    - .jpeg
    - .webp


# Optional private link. Prefer SHAREDSERVER_TOKEN over storing a secret here.
# security:
#   token: replace-with-a-long-random-token

# Optional alternatives (do not combine token and PIN):
# security:
#   auth: "username:password"  # prefer SHAREDSERVER_AUTH
#   pin: "123456"             # keep numeric PINs quoted
#   random_path: "replace-with-a-long-random-url-safe-secret"
# max_upload_size: 0 inside share means unlimited; the default stays 1 GiB.
